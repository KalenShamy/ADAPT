<title>CeSHarP Parse View</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column document-style report; sticky tab bar; coverage grid, objective tree, section outline with length bars. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1b2330;
  --muted: #5b6676;
  --line: #dde1e8;
  --accent: #1f6f78;
  --accent-soft: #e0f0f1;
  --ok: #2d7a4d;
  --warn: #9a6200;
  --warn-soft: #fbefd6;
  --bad: #b3362f;
  --bad-soft: #f9e1df;
  --bar: #9cc7cb;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171f; --surface: #1a212c; --fg: #e4e8ee; --muted: #9aa5b5; --line: #2c3544;
    --accent: #6cc4cc; --accent-soft: #1d3a3e; --ok: #6fcf97; --warn: #e8b04b; --warn-soft: #3a2f17;
    --bad: #f08a82; --bad-soft: #3d1f1d; --bar: #2f6b72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171f; --surface: #1a212c; --fg: #e4e8ee; --muted: #9aa5b5; --line: #2c3544;
  --accent: #6cc4cc; --accent-soft: #1d3a3e; --ok: #6fcf97; --warn: #e8b04b; --warn-soft: #3a2f17;
  --bad: #f08a82; --bad-soft: #3d1f1d; --bar: #2f6b72; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 980px; margin: 0 auto; padding-block: 28px 56px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 32px 0 12px; }
.meta { color: var(--muted); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
nav { display: flex; gap: 4px; margin: 20px 0 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
nav a {
  padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; font-weight: 500;
}
nav a:hover { color: var(--fg); }
nav a[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav .count { font-family: var(--font-mono); font-size: 11px; margin-left: 6px; color: var(--muted); }
.titles { display: grid; gap: 10px; margin-top: 16px; }
.titles div { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.label { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.coverage { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.cell .num { font-family: var(--font-mono); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.cell.empty { background: var(--warn-soft); border-color: transparent; }
.cell.empty .num { color: var(--warn); }
.cell .name { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.list { display: grid; gap: 6px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.objective { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
.objective ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; border-left: 2px solid var(--line); }
.objective li { padding-left: 14px; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); }
.outline { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
.section { display: grid; grid-template-columns: 1fr 120px 54px; gap: 12px; align-items: center; padding: 5px 12px; border-bottom: 1px solid var(--line); min-width: 460px; }
.section:last-child { border-bottom: 0; }
.section .num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 8px; }
.section .bar { height: 6px; border-radius: 3px; background: var(--bar); min-width: 2px; }
.section .size { height: 6px; }
.section.blank .title { color: var(--muted); }
.issue { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; overflow-wrap: anywhere; }
.issue.Error { border-left-color: var(--bad); }
.issue .pill { margin-right: 8px; }
.note { color: var(--muted); max-width: 65ch; }
[hidden] { display: none !important; }
</style>

<main>
  <h1 id="study-name"></h1>
  <div class="meta" id="file-meta"></div>
  <nav id="tabs" aria-label="Views"></nav>
  <div id="view"></div>
</main>

<script>
const DATA = /*CESHARP_DATA*/null;

const COVERAGE_LABELS = {
  studyIdentifiers: "Study identifiers", titles: "Titles", objectives: "Objectives", estimands: "Estimands",
  analysisPopulations: "Analysis populations", studyInterventions: "Interventions", abbreviations: "Abbreviations",
  organizations: "Organizations", roles: "Roles", narrativeContentItems: "Narrative sections",
  arms: "Arms", epochs: "Epochs", encounters: "Visits (encounters)", activities: "Activities",
  scheduleTimelines: "Schedule timelines", eligibilityCriteria: "Eligibility criteria", indications: "Indications",
  eligibilityCriterionItems: "Criterion items"
};
const DESIGN_FIRST = ["arms", "epochs", "encounters", "activities", "scheduleTimelines", "eligibilityCriteria"];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function section(title) { return el("h2", "", title); }
function pill(text, kind) { return el("span", "pill" + (kind ? " " + kind : ""), text); }

function overviewView() {
  const root = document.createDocumentFragment();
  const titles = el("div", "titles");
  DATA.titles.forEach(function (title) {
    const box = el("div");
    box.append(el("div", "label", title.type), el("div", "", title.text));
    titles.append(box);
  });
  root.append(titles);

  root.append(section("What the importer filled"));
  root.append(el("p", "note", "Each tile is a USDM v4 element. Amber tiles came back empty from this document."));
  const grid = el("div", "coverage");
  const keys = Object.keys(DATA.counts).filter(function (key) { return COVERAGE_LABELS[key]; });
  keys.sort(function (a, b) {
    return (DATA.counts[a] === 0 ? 0 : 1) - (DATA.counts[b] === 0 ? 0 : 1) || a.localeCompare(b);
  });
  keys.forEach(function (key) {
    const cell = el("div", "cell" + (DATA.counts[key] === 0 ? " empty" : ""));
    cell.append(el("div", "num", String(DATA.counts[key])), el("div", "name", COVERAGE_LABELS[key]));
    grid.append(cell);
  });
  root.append(grid);

  if (DATA.estimands.length) {
    root.append(section("Estimands"));
    const list = el("div", "list");
    DATA.estimands.forEach(function (item) {
      const row = el("div", "row");
      row.append(pill(item.name), document.createTextNode(" " + item.population));
      list.append(row);
    });
    root.append(list);
  }
  if (DATA.populations.length) {
    root.append(section("Analysis populations"));
    const list = el("div", "list");
    DATA.populations.forEach(function (item) {
      const row = el("div", "row");
      row.append(pill(item.name), document.createTextNode(" " + item.text));
      list.append(row);
    });
    root.append(list);
  }
  if (DATA.interventions.length) {
    root.append(section("Interventions"));
    root.append(el("p", "note", "Names are the M11 field labels; the importer defaulted role and type where the document gave none."));
    const list = el("div", "list");
    DATA.interventions.forEach(function (item) {
      const row = el("div", "row");
      row.append(el("span", "", item.name + " "), pill(item.role || "no role", item.role ? "" : "warn"), document.createTextNode(" "), pill(item.type || "no type", item.type ? "" : "warn"));
      list.append(row);
    });
    root.append(list);
  }
  return root;
}

function objectivesView() {
  const root = document.createDocumentFragment();
  DATA.objectives.forEach(function (objective) {
    const box = el("div", "objective");
    box.append(pill(objective.level || "Objective"), el("div", "", objective.text));
    if (objective.endpoints.length) {
      const list = el("ul");
      objective.endpoints.forEach(function (endpoint) {
        const item = el("li");
        item.append(el("div", "label", endpoint.level || "Endpoint"), el("div", "", endpoint.text));
        list.append(item);
      });
      box.append(list);
    }
    root.append(box);
  });
  if (!DATA.objectives.length) root.append(el("p", "note", "No objectives were extracted."));
  return root;
}

let sectionFilter = "all";
function sectionsView() {
  const root = document.createDocumentFragment();
  const toolbar = el("div", "toolbar");
  [["all", "All sections"], ["issues", "With issues"], ["blank", "No text"]].forEach(function (option) {
    const button = el("button", "pill" + (sectionFilter === option[0] ? "" : " warn"), option[1]);
    button.type = "button";
    button.id = "filter-" + option[0];
    button.addEventListener("click", function () { sectionFilter = option[0]; render(); });
    toolbar.append(button);
  });
  root.append(toolbar);
  const maxChars = Math.max.apply(null, DATA.sections.map(function (item) { return item.chars; }).concat([1]));
  const outline = el("div", "outline");
  DATA.sections.forEach(function (item) {
    const blank = item.chars < 80;
    if (sectionFilter === "issues" && !item.issues) return;
    if (sectionFilter === "blank" && !blank) return;
    const depth = item.number ? item.number.split(".").length - 1 : 0;
    const row = el("div", "section" + (blank ? " blank" : ""));
    const label = el("div", "title");
    label.style.paddingLeft = depth * 18 + "px";
    label.append(el("span", "num", item.number), document.createTextNode(item.title));
    const size = el("div", "size");
    const bar = el("div", "bar");
    bar.style.width = Math.max(2, Math.round(Math.sqrt(item.chars / maxChars) * 100)) + "%";
    bar.title = item.chars.toLocaleString() + " characters";
    size.append(bar);
    const flag = el("div");
    if (item.issues) flag.append(pill(String(item.issues), "bad"));
    row.append(label, size, flag);
    outline.append(row);
  });
  root.append(outline);
  root.append(el("p", "note", "Bar length is the square root of the section's text length. Red counts are importer errors or warnings that name the section."));
  return root;
}

function issuesView() {
  const root = document.createDocumentFragment();
  if (!DATA.issues.length) root.append(el("p", "note", "The importer reported no warnings or errors."));
  DATA.issues.forEach(function (issue) {
    const row = el("div", "issue " + issue.level);
    row.append(pill(issue.level, issue.level === "Error" ? "bad" : "warn"), document.createTextNode(issue.message));
    root.append(row);
  });
  return root;
}

const TABS = [
  { id: "overview", label: "Overview", render: overviewView },
  { id: "objectives", label: "Objectives", render: objectivesView, count: function () { return DATA.objectives.length; } },
  { id: "sections", label: "Sections", render: sectionsView, count: function () { return DATA.sections.length; } },
  { id: "issues", label: "Parse issues", render: issuesView, count: function () { return DATA.issues.length; } }
];

function currentTab() {
  const id = location.hash.slice(1);
  return TABS.find(function (tab) { return tab.id === id; }) || TABS[0];
}

function render() {
  const active = currentTab();
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren();
  TABS.forEach(function (tab) {
    const link = el("a", "", tab.label);
    link.href = "#" + tab.id;
    if (tab === active) link.setAttribute("aria-current", "true");
    if (tab.count) link.append(el("span", "count", String(tab.count())));
    tabs.append(link);
  });
  document.getElementById("view").replaceChildren(active.render());
}

document.getElementById("study-name").textContent = DATA.studyName + " as CeSHarP data";
document.getElementById("file-meta").textContent = DATA.file + " · USDM v" + DATA.usdmVersion + " via usdm4_protocol M11 importer";
window.addEventListener("hashchange", render);
render();
</script>
