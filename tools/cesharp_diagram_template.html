<title>CeSHarP Data Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one figure, document parts on the left, USDM elements on the right, one labelled arrow per row. */
:root {
  --bg: #f6f7f9;
  --fg: #1b2330;
  --muted: #5b6676;
  --line: #b9c1ce;
  --surface: #ffffff;
  --accent: #1f6f78;
  --accent-soft: #dcefef;
  --warn: #9a6200;
  --warn-soft: #fbefd6;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171f; --fg: #e4e8ee; --muted: #9aa5b5; --line: #3a4455; --surface: #1a212c;
    --accent: #6cc4cc; --accent-soft: #1d3a3e; --warn: #e8b04b; --warn-soft: #3a2f17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171f; --fg: #e4e8ee; --muted: #9aa5b5; --line: #3a4455; --surface: #1a212c;
  --accent: #6cc4cc; --accent-soft: #1d3a3e; --warn: #e8b04b; --warn-soft: #3a2f17; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1080px; margin: 0 auto; padding-block: 24px 40px; }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 4px; text-wrap: balance; }
.meta { color: var(--muted); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
figure { margin: 20px 0 0; }
.scroll { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--fg); }
svg text { font-family: var(--font-body); fill: currentColor; }
svg .mono { font-family: var(--font-mono); }
svg .muted { fill: var(--muted); }
svg .source { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg .filled { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
svg .empty { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
svg .link { stroke: var(--line); stroke-width: 1.4; fill: none; }
svg .link.ok { stroke: var(--accent); }
svg .link.none { stroke: var(--warn); stroke-dasharray: 5 4; }
svg .arrowhead { fill: var(--line); }
svg .arrowhead.ok { fill: var(--accent); }
svg .arrowhead.none { fill: var(--warn); }
svg .empty-text { fill: var(--warn); }
svg .filled-text { fill: var(--accent); }
figcaption { color: var(--muted); max-width: 70ch; margin-top: 12px; }
</style>

<main>
  <h1 id="study-name"></h1>
  <div class="meta" id="file-meta"></div>
  <figure>
    <div class="scroll"><svg id="map" viewBox="0 0 1040 690" role="img" aria-label="Map from parts of the protocol document to the USDM elements the importer filled from them"></svg></div>
    <figcaption id="caption"></figcaption>
  </figure>
</main>

<script>
const DATA = /*CESHARP_DATA*/null;
const SVG_NS = "http://www.w3.org/2000/svg";

const ROW_TOP = 70, ROW_GAP = 76, BOX_HEIGHT = 54;
const SOURCE_X = 20, SOURCE_WIDTH = 270, TARGET_X = 520, TARGET_WIDTH = 500;

// source: what the importer looks at in the docx; targets: USDM elements it fills from that.
const ROWS = [
  { source: "Title page table", detail: "11 labelled fields", via: "field → value",
    targets: [["StudyVersion", "titles"], ["StudyVersion", "studyIdentifiers"]] },
  { source: "1.1.1 Objectives table", detail: "objective | endpoint rows", via: "row → objective + endpoints",
    targets: [["StudyDesign", "objectives"], ["Objective", "endpoints"]] },
  { source: "1.1.1 Estimand tables", detail: "one table per estimand", via: "table → estimand",
    targets: [["StudyDesign", "estimands"], ["StudyDesign", "analysisPopulations"]] },
  { source: "1.1.2 Overall design", detail: "design table", via: "rows → arms, epochs",
    targets: [["StudyDesign", "arms"], ["StudyDesign", "epochs"]], reason: /1\.1\.2/ },
  { source: "1.3 Schedule of activities", detail: "visits × procedures grid", via: "grid → timeline",
    targets: [["StudyDesign", "encounters"], ["StudyDesign", "activities"], ["StudyDesign", "scheduleTimelines"]], reason: /SoA/ },
  { source: "5.2 / 5.3 Criteria", detail: "inclusion and exclusion lists", via: "list item → criterion",
    targets: [["StudyDesign", "eligibilityCriteria"], ["StudyVersion", "eligibilityCriterionItems"]], reason: /section 5\.[23]/ },
  { source: "6 Trial interventions", detail: "intervention fields", via: "field → intervention",
    targets: [["StudyVersion", "studyInterventions"]] },
  { source: "Headings 1–14 and body text", detail: "every numbered section", via: "heading + text → narrative item",
    targets: [["StudyVersion", "narrativeContentItems"]] }
];

function node(tag, attributes, text) {
  const item = document.createElementNS(SVG_NS, tag);
  Object.keys(attributes || {}).forEach(function (key) { item.setAttribute(key, attributes[key]); });
  if (text !== undefined) item.textContent = text;
  return item;
}

function countFor(name) { return DATA.counts[name] || 0; }

function marker(svg, id, className) {
  const arrow = node("marker", { id: id, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto" });
  arrow.append(node("path", { d: "M0 0 L10 5 L0 10 z", class: "arrowhead " + className }));
  return arrow;
}

function reasonFor(row) {
  if (!row.reason) return "none extracted";
  const issue = DATA.issues.find(function (item) { return row.reason.test(item.message); });
  if (!issue) return "none extracted";
  if (/AI provider/.test(issue.message)) return "reader needs an AI provider";
  if (/Failed to find/.test(issue.message)) return "no list or table found";
  return "importer warning, see issues";
}

function draw() {
  const svg = document.getElementById("map");
  const defs = node("defs");
  defs.append(marker(svg, "arrow-ok", "ok"), marker(svg, "arrow-none", "none"));
  svg.append(defs);

  svg.append(node("text", { x: SOURCE_X, y: 36, class: "muted", "font-size": 12, "letter-spacing": "0.06em" }, "IN THE .DOCX"));
  svg.append(node("text", { x: TARGET_X, y: 36, class: "muted", "font-size": 12, "letter-spacing": "0.06em" }, "IN THE USDM TREE (NAME, ELEMENTS FILLED)"));

  ROWS.forEach(function (row, index) {
    const top = ROW_TOP + index * ROW_GAP;
    const middle = top + BOX_HEIGHT / 2;
    const total = row.targets.reduce(function (sum, target) { return sum + countFor(target[1]); }, 0);
    const state = total > 0 ? "ok" : "none";

    svg.append(node("rect", { x: SOURCE_X, y: top, width: SOURCE_WIDTH, height: BOX_HEIGHT, rx: 6, class: "source" }));
    svg.append(node("text", { x: SOURCE_X + 14, y: top + 23, "font-size": 14, "font-weight": 600 }, row.source));
    svg.append(node("text", { x: SOURCE_X + 14, y: top + 42, "font-size": 12, class: "muted" }, row.detail));

    svg.append(node("line", {
      x1: SOURCE_X + SOURCE_WIDTH, y1: middle, x2: TARGET_X - 2, y2: middle,
      class: "link " + state, "marker-end": "url(#arrow-" + state + ")"
    }));
    svg.append(node("text", { x: (SOURCE_X + SOURCE_WIDTH + TARGET_X) / 2, y: middle - 8, "text-anchor": "middle", "font-size": 12, class: "muted" }, row.via));

    svg.append(node("rect", { x: TARGET_X, y: top, width: TARGET_WIDTH, height: BOX_HEIGHT, rx: 6, class: total > 0 ? "filled" : "empty" }));
    const parents = Array.from(new Set(row.targets.map(function (target) { return target[0]; }))).join(" / ");
    svg.append(node("text", { x: TARGET_X + 14, y: top + 21, "font-size": 11, class: "mono muted" }, parents));
    const counts = node("text", { x: TARGET_X + 14, y: top + 41, "font-size": 13, class: "mono " + (total > 0 ? "filled-text" : "empty-text") });
    row.targets.forEach(function (target, position) {
      const piece = node("tspan", { dx: position ? 16 : 0 }, target[1] + " " + countFor(target[1]));
      counts.append(piece);
    });
    svg.append(counts);
    if (total === 0) {
      svg.append(node("text", { x: TARGET_X + TARGET_WIDTH - 14, y: top + 21, "text-anchor": "end", "font-size": 12, class: "empty-text" }, reasonFor(row)));
    }
  });
}

function caption() {
  const filled = ROWS.filter(function (row) {
    return row.targets.some(function (target) { return countFor(target[1]) > 0; });
  }).length;
  document.getElementById("caption").textContent =
    "Each row is a part of the protocol document and the USDM elements the M11 importer built from it. " +
    "Solid blue-green rows were filled (" + filled + " of " + ROWS.length + "); dashed amber rows came back empty. " +
    "Counts are the number of USDM objects of that kind found in this document.";
}

document.getElementById("study-name").textContent = DATA.studyName + ": where the CeSHarP data sits";
document.getElementById("file-meta").textContent = DATA.file + " · USDM v" + DATA.usdmVersion;
draw();
caption();
</script>
